<style>
/* Layout: one phone-width column, content scrolls, one main action pinned at the bottom. Single dark look by design. */
:root{
  --ground:#0B0B0C; --surface:#1A1A1D; --plate:#1C1C20; --raised:#2A2A2E; --line:#3A3A40; --hair:#222226;
  --fg:#FFFFFF; --soft:#B9B9BF; --quiet:#9A9AA0; --accent:#FF6A1A; --on-accent:#0B0B0C;
  --disp:'Barlow Condensed','Arial Narrow',sans-serif; --body:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,p{margin:0}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden}
.scr{flex:1;min-height:0;overflow-y:auto;padding-block:20px 16px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column}
.foot{flex:none;padding-block:8px 12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px}
.foot.nav{padding-block:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px}
.lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--quiet);font-weight:500}
.lbl.acc{color:var(--accent);font-weight:600;font-size:13px}
.lbl.mid{color:var(--soft);font-weight:600;font-size:13px;text-align:center;flex:1}
.disp{font-family:var(--disp);font-weight:700;text-transform:uppercase;line-height:.88;letter-spacing:-.01em;overflow-wrap:anywhere}
.num{font-family:var(--disp);font-weight:700;font-variant-numeric:tabular-nums}
.soft{color:var(--soft)} .quiet{color:var(--quiet)} .acc{color:var(--accent)}
.icon{width:44px;height:44px;border-radius:22px;background:var(--surface);display:flex;align-items:center;justify-content:center;flex:none}
.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.main{height:68px;border-radius:4px;background:var(--accent);color:var(--on-accent);font-family:var(--disp);font-size:28px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;padding:0 24px;width:100%;text-align:left}
.main svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.main.ghost{background:none;border:1px solid var(--line);color:var(--fg);height:52px;font-size:22px}
.txt{min-height:44px;font-size:15px;font-weight:600;text-decoration:underline;text-underline-offset:4px;align-self:center;padding:0 8px}
.txt.warn{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:4px;border:1px solid var(--line);font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.chip.on{background:var(--fg);border-color:var(--fg);color:var(--ground);font-weight:600}
.chip.dash{border-style:dashed;color:var(--soft)}
.chip svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tag{height:24px;padding:0 8px;border-radius:4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;display:inline-flex;align-items:center;white-space:nowrap}
.tag.best{background:var(--accent);color:var(--on-accent)}
.tag.stale{border:1px dashed var(--soft);text-transform:none;letter-spacing:0}
.tag.info{border:1px solid var(--line);color:var(--soft)}
.list{display:flex;flex-direction:column;border-top:1px solid var(--hair)}
.row{min-height:60px;border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:8px 0}
.row .ix{width:20px;font-family:var(--disp);font-size:22px;font-weight:600;color:var(--quiet);flex:none}
.row .nm{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.row .nm b{font-size:16px;font-weight:600;overflow-wrap:anywhere}
.row .nm span{font-size:13px;color:var(--quiet)}
.row .rt{margin-left:auto;font-size:13px;color:var(--soft);flex:none;display:flex;align-items:center;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.tile{background:var(--surface);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .num{font-size:40px;line-height:1}
.tile span:last-child{font-size:13px;color:var(--soft)}
.bars{display:grid;gap:6px}
.bars i{height:8px;background:var(--raised);display:block}
.bars i.on{background:var(--accent)}
.navb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));height:64px;border-top:1px solid var(--hair)}
.navb button{color:var(--quiet);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.navb button.on{color:var(--fg)}
.rest{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.rest[hidden]{display:none}
.rest div:first-child{display:flex;justify-content:space-between;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.rest .bar{height:3px;background:var(--raised)}
.rest .bar i{display:block;height:3px;background:var(--accent);width:0}
.pick{display:flex;gap:20px;align-items:stretch;margin-top:18px}
.stack{width:128px;flex:none;display:flex;flex-direction:column;gap:4px}
.stack button{height:44px;background:var(--plate);color:var(--quiet);font-family:var(--disp);font-size:20px;font-weight:600;text-align:left;padding:0 12px;display:flex;justify-content:space-between;align-items:center}
.stack button small{font-family:var(--body);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.stack button.ref{color:var(--fg)}
.stack button.on{background:var(--accent);color:var(--on-accent);font-size:22px;font-weight:700}
.stack button.on svg{width:34px;height:14px}
.side{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.bigrow{display:flex;align-items:baseline;gap:8px;min-width:0}
.big{font-family:var(--disp);font-weight:700;font-size:104px;line-height:.9;letter-spacing:-.02em;min-width:0;background:none;border:0;border-bottom:1px solid transparent;padding:0;border-radius:0}
.big:focus{outline:none;border-bottom-color:var(--accent)}
.big{font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:4px;height:60px;padding:0 6px}
.step button{width:48px;height:48px;border-radius:4px;background:var(--raised);font-size:26px;line-height:1}
.step span{display:flex;align-items:baseline;gap:6px}
.step .num{font-size:40px}
.sets{margin-top:18px;display:flex;flex-direction:column}
.sets>div{display:grid;grid-template-columns:40px 1fr 1.2fr;min-height:36px;align-items:center;font-family:var(--disp);font-size:20px;font-weight:500;border-bottom:1px solid var(--hair);font-variant-numeric:tabular-nums}
.sets>div.h{min-height:24px;font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--quiet)}
.sets .d{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sets .d small{font-family:var(--body);font-size:12px;font-weight:600}
.field{height:48px;border-radius:4px;border:1px solid var(--line);background:var(--ground);padding:0 14px;font-size:16px;width:100%;min-width:0}
.field:focus{outline:none;border-color:var(--accent)}
select.field{appearance:none;-webkit-appearance:none;padding-right:40px;font-weight:600}
.sel{position:relative}
.sel svg{position:absolute;right:14px;top:16px;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.inline{display:flex;gap:8px;align-items:center}
.mini{width:44px;height:44px;border-radius:4px;background:var(--surface);font-size:20px;flex:none;display:flex;align-items:center;justify-content:center}
.sheetwrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;z-index:5}
.sheetwrap .dim{position:absolute;inset:0;background:rgba(0,0,0,.6);width:100%}
.sheet{position:relative;background:var(--surface);border-radius:16px 16px 0 0;padding-block:12px 24px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;max-height:86%;overflow-y:auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.opt{min-height:68px;border:1px solid var(--line);border-radius:4px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left}
.opt.on{border-color:var(--accent)}
.opt b{font-size:17px;font-weight:600;display:block}
.opt span.s{font-size:13px;color:var(--soft)}
.note{background:var(--surface);border-radius:4px;padding:12px 14px;font-size:14px;color:var(--soft);display:flex;gap:12px;align-items:center;justify-content:space-between}
.chart{width:100%;height:auto;display:block;font-family:var(--body)}
.ramp{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;align-items:end}
.ramp div{display:flex;flex-direction:column;gap:6px}
.ramp .num{font-size:28px;line-height:1}
.ramp i{display:block;background:var(--raised)}
.gap8{display:flex;flex-direction:column;gap:8px}.gap4{display:flex;flex-direction:column;gap:4px}.mt4{margin-top:4px} .gap12{display:flex;flex-direction:column;gap:12px} .gap16{display:flex;flex-direction:column;gap:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}.grow{flex:1}
@media (prefers-reduced-motion:no-preference){.main:active,.stack button:active,.chip:active{transform:scale(.98)}.rest .bar i{transition:width .5s linear}}

.scr>*{flex-shrink:0}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.center{text-align:center}.sm{font-size:13px}
.unit{color:var(--soft);font-weight:600;font-size:15px;white-space:nowrap}
.bignum{font-family:var(--disp);font-weight:700;font-size:96px;line-height:.9;letter-spacing:-.02em;display:inline-block;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--quiet)}
.pick{display:flex;gap:30px;align-items:stretch;margin-top:8px}
.eqrow{display:flex;justify-content:space-between;align-items:center;min-height:32px}
.txt.sm{min-height:32px;font-size:13px;padding:0}
.note-btn{min-height:36px;display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--soft);align-self:flex-start;text-align:left}
.note-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;flex:none}
/* wheels: native scroll + snap, JS only reads the centred item */
.wheel{display:flex;gap:4px;overflow:auto;overscroll-behavior:contain;scrollbar-width:none;scroll-snap-type:x mandatory;position:relative}
.wheel::-webkit-scrollbar{display:none}
.wheel.v{flex-direction:column;scroll-snap-type:y mandatory}
.wheel:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wi{flex:none;scroll-snap-align:center}
.repsbox{position:relative;background:var(--surface);border-radius:4px;margin-top:8px}
.repsbox::after{content:'';position:absolute;left:50%;bottom:5px;width:20px;height:3px;margin-left:-10px;background:var(--accent);border-radius:2px;pointer-events:none}
.wheel.reps{height:68px;align-items:center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 24%,#000 76%,transparent);mask-image:linear-gradient(90deg,transparent,#000 24%,#000 76%,transparent)}
.reps .wi{width:52px;height:60px;font-family:var(--disp);font-size:24px;font-weight:600;color:var(--quiet);transition:color .15s,transform .15s}
.reps .wi.on{color:var(--fg);transform:scale(1.5)}
.stackwrap{position:relative;width:128px;flex:none}
.wheel.stack2{height:236px;-webkit-mask-image:linear-gradient(180deg,transparent,#000 20%,#000 80%,transparent);mask-image:linear-gradient(180deg,transparent,#000 20%,#000 80%,transparent)}
.stack2 .wi{height:44px;width:100%;background:var(--plate);color:var(--quiet);font-family:var(--disp);font-size:20px;font-weight:600;text-align:left;padding:0 12px;display:flex;justify-content:space-between;align-items:center;border-radius:2px;transition:background .15s,color .15s}
.stack2 .wi small{font-family:var(--body);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.stack2 .wi.on{background:var(--accent);color:var(--on-accent);font-weight:700;font-size:22px}
.stack2 .wi.on small{display:none}
.pinmark{position:absolute;top:50%;right:-22px;width:84px;height:16px;margin-top:-8px;pointer-events:none}
.wheel.rack{height:124px;align-items:flex-end;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
.rack .wi{width:58px;height:118px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.rack .wi svg{transition:transform .2s cubic-bezier(.2,.9,.3,1.3)}
.rack polygon{fill:var(--raised);stroke:var(--line);stroke-width:2;transition:fill .15s,stroke .15s}
.rack circle{fill:var(--ground)}
.rack .wi span{font-family:var(--disp);font-size:16px;font-weight:600;color:var(--quiet)}
.rack .wi.on svg{transform:translateY(-8px)}
.rack .wi.on polygon{fill:var(--accent);stroke:var(--accent)}
.rack .wi.on span{color:var(--fg)}
.barsvg{width:100%;height:auto;display:block;margin-top:8px}
.barsvg .pl{cursor:pointer}
.plates{display:flex;justify-content:space-between;gap:4px;margin-top:10px}
.pbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);font-family:var(--disp);font-size:17px;font-weight:600;flex:none;transition:background .15s,color .15s}
.pbtn:active{background:var(--fg);color:var(--ground)}
.chip:disabled{opacity:.4}
.alert{background:var(--surface);border-left:3px solid var(--accent);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.alert[hidden]{display:none}
.alert b{font-size:15px;font-weight:600}
.alert p{font-size:14px;color:var(--soft)}
.tag.warn{border:1px solid var(--accent);color:var(--accent)}
.toasts{position:fixed;left:0;right:0;top:max(12px,env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:20;pointer-events:none;padding:0 16px}
.toast{background:var(--fg);color:var(--ground);border-radius:4px;padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:440px}
.toast .num{font-size:22px;line-height:1}
.sw{width:56px;height:44px;display:flex;align-items:center;justify-content:flex-end;flex:none}
.sw i{width:52px;height:32px;border-radius:16px;background:var(--raised);position:relative;transition:background .2s}
.sw i::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:12px;background:var(--soft);transition:transform .22s cubic-bezier(.2,.9,.3,1.2),background .2s}
.sw[aria-checked="true"] i{background:var(--fg)}
.sw[aria-checked="true"] i::after{transform:translateX(20px);background:var(--ground)}
.limrow{background:var(--surface);border-radius:4px;padding:8px 12px 12px;display:flex;flex-direction:column;gap:6px}
.limrow .step{background:var(--ground);height:52px}
.limrow .step .num{font-size:30px}
.limrow.off .step{opacity:.35}
.step button:disabled{opacity:.5}
.feat{display:flex;gap:16px;align-items:flex-start}
.feat .num{font-size:28px;color:var(--accent);line-height:1;width:34px;flex:none}
.feat b{font-size:16px;font-weight:600;display:block}
.feat p{font-size:14px;color:var(--soft);margin-top:4px}
.opt .tick{width:28px;height:28px;border-radius:14px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:none}
.opt .tick svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.opt{transition:border-color .2s}
button.row:active{background:var(--surface)}
.chip{transition:background .15s,color .15s,border-color .15s}
.navb{position:relative}
.navb .ind{position:absolute;top:0;left:0;width:33.3333%;height:2px;background:var(--accent);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.scr.splash{padding:0}
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;width:100%;min-height:100%}
.sp-stack{position:relative;display:flex;flex-direction:column;gap:5px;width:96px}
.sp-stack i{height:12px;background:var(--raised);border-radius:2px;display:block}
.sp-pin{position:absolute;top:55px;right:-46px;width:66px;height:4px;background:var(--fg);border-radius:2px}
.sp-pin::after{content:'';position:absolute;right:-6px;top:-5px;width:14px;height:14px;border-radius:7px;background:var(--fg)}
.sp-word{font-size:104px;letter-spacing:.01em}
.sp-tag{color:var(--soft);font-size:15px}
@media (prefers-reduced-motion:no-preference){
  .scr.in{animation:fadeIn .25s ease-out both}
  .hero{animation:heroIn .45s cubic-bezier(.2,.8,.2,1) both}
  .scr.in .row{animation:rowIn .3s ease-out both;animation-delay:calc(var(--i,0)*35ms)}
  .feat{animation:rowIn .45s ease-out both;animation-delay:calc(200ms + var(--i,0)*90ms)}
  .alert{animation:rowIn .35s ease-out both}
  .sheet{animation:sheetUp .32s cubic-bezier(.2,.9,.3,1) both}
  .sheetwrap .dim{animation:fadeIn .25s both}
  .bump{animation:bump .2s ease-out}
  .pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.3) both}
  .grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .55s cubic-bezier(.2,.8,.2,1) both}
  .draw{stroke-dasharray:1;animation:draw .9s ease-out both}
  .pl.new.r{transform-box:fill-box;animation:plR .35s cubic-bezier(.2,.9,.3,1.2) both}
  .pl.new.l{transform-box:fill-box;animation:plL .35s cubic-bezier(.2,.9,.3,1.2) both}
  .toast{animation:toastIn .4s cubic-bezier(.2,.9,.3,1.25) both}
  .toast.out{animation:toastOut .25s ease-in both}
  .sp-stack i{animation:spIn .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k)*70ms)}
  .sp-stack i.hit{animation:spIn .45s cubic-bezier(.2,.8,.2,1) both,spHit .25s 1.05s both;animation-delay:calc(var(--k)*70ms),1.05s}
  .sp-pin{animation:spPin .5s .62s cubic-bezier(.3,1.4,.5,1) both}
  .sp-word{animation:heroIn .55s 1.1s cubic-bezier(.2,.8,.2,1) both}
  .sp-tag{animation:fadeIn .5s 1.45s both}
}
@media (prefers-reduced-motion:reduce){.sp-stack i.hit{background:var(--accent)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes heroIn{from{opacity:0;transform:translateY(18px)}}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}}
@keyframes sheetUp{from{transform:translateY(100%)}}
@keyframes bump{40%{transform:translateY(-4px) scale(1.04)}}
@keyframes pop{0%{background:rgba(255,106,26,.28)}100%{background:transparent}}
@keyframes grow{from{transform:scaleY(0)}}

  sheet:function(){V.sheet=true;render()},sheetClose:function(){V.sheet=false;render()},
  pickOpt:function(d){var sl=slotFor(S.active.entries[S.active.idx]),hit=null;if(sl)sl.options.forEach(function(o){if(o.id===d.id)hit=o});if(hit)useOption(hit);else{V.sheet=false;render()}},
  exHistory:function(){var e=S.active.entries[S.active.idx];go('exercise',{key:exKey(e.name,e.optionName),label:e.name,from:'log'})},
  exOpen:function(d){go('exercise',{key:d.k,from:'summary',wid:V.id,fresh:V.fresh})},
  exBack:function(){if(V.from==='log'&&S.active)go('log');else if(V.from==='summary')go('summary',{id:V.wid,fresh:V.fresh});else go('progress')},
  exSwitch:function(d){V.key=d.k;V.all=false;render()},exAll:function(){V.all=true;render()},
  finish:function(){finishWorkout()},
  finishEarly:function(){var a=S.active;if(a&&!a.entries.some(function(e){return e.sets.length})){finishWorkout();return}twoTap('fin',finishWorkout)},
  discard:function(){twoTap('discard',function(){S.active=null;save();go('today')})},
  openWorkout:function(d){go('summary',{id:d.id})},
  delWorkout:function(d){twoTap('delW',function(){S.workouts=S.workouts.filter(function(w){return w.id!==d.id});save();go('history')})},
  range:function(d){V.range=d.r;render()},
  useProgram:function(d){S.activeProgram=d.id;save();render()},
  newProgram:function(d){var p=makeProgram(d.t);S.programs.push(p);save();go('editProgram',{id:p.id})},
  editProgram:function(d){go('editProgram',{id:d.id})},
  delProgram:function(d){twoTap('dp',function(){S.programs=S.programs.filter(function(p){return p.id!==d.id});if(S.activeProgram===d.id)S.activeProgram=S.programs[0].id;save();go('programs')})},
  delSession:function(d){twoTap('ds'+d.id,function(){S.programs.forEach(function(p){p.sessions=p.sessions.filter(function(s){return s.id!==d.id})});save();render()})},
  editSession:function(d){go('editSession',{id:d.id,back:V.name,backId:V.id,ramp:V.ramp})},
  editBack:function(){if(V.back==='editProgram')go('editProgram',{id:V.backId});else go('session',{id:V.id,ramp:V.ramp})},
  delSlot:function(d){twoTap('dx'+d.id,function(){var x=slotById(d.id);if(x){x.s.slots=x.s.slots.filter(function(sl){return sl.id!==d.id});V.open=null;save()}render()})},
  slotUp:function(d){var x=slotById(d.id);if(!x)return;var i=x.s.slots.indexOf(x.sl);if(i>0){x.s.slots.splice(i,1);x.s.slots.splice(i-1,0,x.sl);save();render()}},
  slotSets:function(d){var x=slotById(d.id);if(!x)return;x.sl.sets=Math.min(10,Math.max(1,x.sl.sets+ +d.d));save();render()},
  unit:function(d){S.unit=d.u;save();render()},stepSize:function(d){S.step=+d.s;save();render()},
  restLen:function(d){S.rest=Math.min(600,Math.max(0,S.rest+ +d.d));save();render()},
  sampleOn:function(d){loadSample(+d.off||0);if(d.off)go('today');else render()},sampleOff:function(){removeSample();render();toast('Example workouts cleared')},
  wipe:function(){twoTap('wipe',function(){S=fresh();save();go('splash')})}
};
var CHG={
  weight:function(v){var x=parseFloat(String(v).replace(',','.'));if(isFinite(x)&&x>=0&&x<2000){var d=draft();d.w=+x.toFixed(2);d.plates=null;save()}render()},
  reps:function(v){var x=parseInt(v,10);if(isFinite(x)&&x>0&&x<1000){draft().r=x;save()}render()},
  exSel:function(v){V.key=v;render()},
  profName:function(v){S.profile=S.profile||{};S.profile.name=v.trim().slice(0,30);save();render()},
  pName:function(v){S.programs.forEach(function(p){if(p.id===V.id&&v.trim())p.name=v.trim()});save()},
  sName:function(v,d){var s=findSession(d.id);if(s&&v.trim()){s.name=v.trim();save()}},
  sExtra:function(v,d,el){var s=findSession(V.id);if(s){s.extra=el.checked;save()}},
  xName:function(v,d){var x=slotById(d.id);if(x&&v.trim()){x.sl.name=v.trim();save()}}
};
var FORM={
  addEntry:function(v){var a=S.active,hit=null;S.programs.forEach(function(p){p.sessions.forEach(function(s){s.slots.forEach(function(sl){if(!hit&&sl.name.toLowerCase()===v.toLowerCase())hit=sl})})});
    if(hit){var o=optOf(hit);a.entries.push({slotId:hit.id,name:hit.name,kind:hit.kind,target:hit.sets,optionId:o.id,optionName:o.name,sets:[]})}
    else a.entries.push({slotId:null,name:v,kind:'lift',target:3,optionId:uid(),optionName:'',sets:[]});save();render()},
  addOpt:function(v){var sl=slotFor(S.active.entries[S.active.idx]);if(!sl)return;var o=null;sl.options.forEach(function(x){if(x.name.toLowerCase()===v.toLowerCase())o=x});if(!o){o={id:uid(),name:v};sl.options.push(o)}useOption(o)},
  note:function(v){var e=S.active.entries[S.active.idx],o=optRec(e);if(o)o.note=v.slice(0,60);V.noteEdit=false;save();render()},
  csNew:function(v){if((V.cs||[]).indexOf(v)<0)V.cs=(V.cs||[]).concat([v.slice(0,24)]);render();var f=$('cs-new');if(f)f.focus()},
  addSession:function(v){S.programs.forEach(function(p){if(p.id===V.id)p.sessions.push({id:uid(),name:v,extra:false,slots:[]})});save();render()},
  addSlot:function(v){var s=findSession(V.id);if(s){s.slots.push(X(v,['']));save();render()}}
};
$('toasts').addEventListener('click',function(ev){var t=ev.target.closest('[data-a]');if(t&&ACT[t.dataset.a])ACT[t.dataset.a](t.dataset)});
app.addEventListener('click',function(ev){var t=ev.target.closest('[data-a]');if(!t||t.disabled)return;var a=t.dataset.a;if(t.getAttribute('aria-disabled')==='true')return;if(V.arm&&['discard','delWorkout','delProgram','delSession','delSlot','wipe','rmSet','finishEarly'].indexOf(a)<0)V.arm=null;if(ACT[a])ACT[a](t.dataset,t)});
app.addEventListener('change',function(ev){var t=ev.target.closest('[data-c]');if(t&&CHG[t.dataset.c])CHG[t.dataset.c](t.value,t.dataset,t)});
app.addEventListener('submit',function(ev){ev.preventDefault();var f=ev.target.closest('[data-f]');if(!f)return;var inp=f.querySelector('input'),v=(inp.value||'').trim();if(f.dataset.f==='note'){FORM.note(v);return}if(v&&FORM[f.dataset.f])FORM[f.dataset.f](v)});
app.addEventListener('input',function(ev){var t=ev.target;if(t.matches('.big'))t.style.cssText=bigStyle(t.value||'0');if(t.id==='lib-q'&&V.lib){V.lib.q=t.value;filterLib()}if(t.id==='ex-q'){V.exq=t.value;var q=t.value.toLowerCase();document.querySelectorAll('#ex-list .librow').forEach(function(r){r.hidden=q&&r.dataset.q.indexOf(q)<0})}});
app.addEventListener('submit',function(ev){if(ev.target.id==='lib-form')ev.preventDefault()},true);
app.addEventListener('keydown',function(ev){if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('[role=button][data-a]')){ev.preventDefault();ev.target.click();return}if(ev.key==='Enter'&&ev.target.matches('.big')){ev.target.blur()}if(ev.key==='Enter'&&ev.target.id==='lib-q'){ev.preventDefault();var nb=$('lib-new');if(nb&&!nb.hidden)ACT.libNew();else ev.target.blur()}if(ev.key==='Escape'&&(V.lib||V.exSheet||V.sheet)){V.lib=null;V.exSheet=false;V.sheet=false;render()}});
render(true);
})();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){})})}</script>
